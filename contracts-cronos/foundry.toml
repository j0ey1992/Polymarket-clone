[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
cronos = "https://evm.cronos.org"
cronos_testnet = "https://evm-t3.cronos.org"

[etherscan]
cronos = { key = "${CRONOSCAN_API_KEY}", url = "https://cronoscan.com/api" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
